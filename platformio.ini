[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps = 
	https://github.com/bastian2001/pico-bidir-dshot.git@1.0.0
	adafruit/Adafruit SSD1306@^2.5.13
	https://github.com/alexitoo00/NewEncoder.git@1.0.4
	br3ttb/PID@^1.2.1
	mathertel/OneButton@^2.6.1